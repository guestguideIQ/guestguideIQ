name: CI

# PR checks for the marketing site. Mirrors guestguideiq-frontend's CI shape
# (verify / scan / scan-built-output) so the team's three repos gate the same
# way. deploy.yml still owns deployment on merge to main; this file never
# deploys anything.
#
# `pull_request` carries NO branch filter on purpose: every PR is gated
# whatever it targets, so the gate cannot silently switch off the next time
# the trunk moves (the backend repo lost its gates for two merges exactly that
# way — see guestguideiq-app/.github/workflows/ci.yml).
#
# Every third-party action is pinned to a commit SHA (`# vN` for
# readability), matching the backend and frontend repos. Bump a pin by
# resolving the new tag's SHA
# (`gh api repos/<owner>/<repo>/git/refs/tags/<tag> --jq .object.sha`).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # gitleaks-action lists the PR's commits on a pull_request event; without
  # this it 403s before scanning anything.
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Same public value deploy.yml bakes in, so the scanned build output is the
  # one that would actually ship. Public by design — see src/site.config.ts.
  PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL || 'https://api.guestguideiq.com' }}

jobs:
  # ---------------------------------------------------------------------
  # Verify. Distinct steps so a failure names what failed. All blocking.
  # `npm run verify` runs the same sequence locally.
  # ---------------------------------------------------------------------
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # Its own step: `astro build` does not type-check. This closes the
      # build-vs-check gap team.md records against this site.
      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # ---------------------------------------------------------------------
  # Scan. Blocking — project.md: never treat a security scanner as advisory.
  # ---------------------------------------------------------------------
  scan:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # gitleaks scans the commit range, which needs history
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Dependency vulnerabilities
        run: npm run audit

      - name: Secret scan (source)
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required because this repo is owned by an organisation:
          # gitleaks-action is licence-free only for personal accounts.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ---------------------------------------------------------------------
  # Scan the built site. A PUBLIC_-prefixed value is compiled into shipped
  # HTML/JS and never appears in the source tree, so a source-only scan would
  # report clean on a leaked key (team.md, Deployment → Secrets handling).
  #
  # The gitleaks binary is invoked directly because the action has no
  # directory mode — it only scans git history, and dist/ is not in git.
  # Pinned by version and checksum, like the actions above.
  # ---------------------------------------------------------------------
  scan-built-output:
    name: Scan built output
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Download build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Secret scan (dist/)
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base=https://github.com/gitleaks/gitleaks/releases/download
          curl -sSfL --retry 3 -o "$tarball" "$base/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks

          # Refuse to scan nothing: `gitleaks dir` on an empty directory
          # exits 0, which would be a green check over a missing artifact.
          test -d dist
          test -n "$(find dist -type f -print -quit)"
          echo "Scanning $(find dist -type f | wc -l) built files."

          ./gitleaks dir dist/ --redact --verbose --exit-code=1
